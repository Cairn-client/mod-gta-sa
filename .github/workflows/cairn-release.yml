name: Cairn release

# A Cairn release is a bare X.Y.Z tag on main. It builds the mod as the project's own workflow does (xmake: client, server, proxy, launcher), puts the
# result with the compiled script into a Cairn mod pack (.github/cairn/Build-Pack.ps1) and publishes the pack, pack-index.json and game.json: the
# Cairn launcher reads the index to install and update this mod. RELEASE_CHANNEL=beta publishes a pre-release (only players who chose beta are
# offered it).
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: The tag must be on main and equal VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "tag $env:GITHUB_REF_NAME is not on main" }
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          if ($v -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME is not VERSION ($v)" }

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build
        shell: pwsh
        run: |
          xmake config -y -m release
          foreach ($t in 'client', 'server', 'proxy', 'launcher') {
            xmake build -y $t
            if ($LASTEXITCODE -ne 0) { throw "building $t failed" }
          }

      - name: Build the pack
        shell: pwsh
        run: ./.github/cairn/Build-Pack.ps1 -BuildDir build

      - name: Changelog
        shell: pwsh
        run: ./.github/cairn/New-ReleaseNotes.ps1 -OutFile notes.md -Tag $env:GITHUB_REF_NAME

      - uses: actions/upload-artifact@v4
        with:
          name: cairn-pack
          path: |
            release/Cairn-Pack-gta-sa-*.zip
            release/pack-index.json
            .github/cairn/game/game.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @("release/Cairn-Pack-gta-sa-$env:GITHUB_REF_NAME.zip", 'release/pack-index.json') + (Get-ChildItem .github/cairn/game -File | ForEach-Object { $_.FullName })
          $flags = @()
          if ((Get-Content RELEASE_CHANNEL -Raw).Trim() -eq 'beta') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @assets --title $env:GITHUB_REF_NAME --notes-file notes.md --verify-tag @flags
